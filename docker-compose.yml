services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_hub
      POSTGRES_USER: ai_hub
      POSTGRES_PASSWORD: local-ai-hub
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_hub -d ai_hub"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - ai-hub-postgres:/var/lib/postgresql/data

volumes:
  ai-hub-postgres:
