name: Community CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn --batch-mode test
      - name: Generate CycloneDX SBOM
        run: mvn --batch-mode org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json
      - uses: actions/upload-artifact@v6
        with:
          name: backend-sbom
          path: backend/target/bom.json

  backend-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dsh_boot4_test
          POSTGRES_USER: dsh_test
          POSTGRES_PASSWORD: dsh-ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dsh_test -d dsh_boot4_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AI_HUB_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/dsh_boot4_test
      AI_HUB_TEST_DATABASE_USERNAME: dsh_test
      AI_HUB_TEST_DATABASE_PASSWORD: dsh-ci-test-only
      AI_HUB_TEST_DATABASE_DRIVER: org.postgresql.Driver
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify PostgreSQL migration and application compatibility
        run: mvn --batch-mode -Ppostgres-test verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > bom.json
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-sbom
          path: frontend/bom.json

  extension-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension-host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension-host/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify built host on Node 22
        run: npm run test:runtime
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > bom.json
      - uses: actions/upload-artifact@v6
        with:
          name: extension-host-sbom
          path: extension-host/bom.json

  public-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify sanitization
        run: ./scripts/verify-community-sanitization.sh
      - name: Test example artifacts
        run: node --test artifacts/*/tests/*.test.mjs
